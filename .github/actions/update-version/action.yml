name: 'Update version'
description: 'Update version in repo without committing. Repo must already be checked out'
inputs:
  new_version:
    description: Version string to set
    required: true

runs:
  using: "composite"
  steps:
  - name: Update VERSION metadata
    run: echo ${{ inputs.new_version }} > VERSION
    shell: bash

  - name: Commit and tag new version
    uses: step-security/git-auto-commit-action@749bc1cc775376092cc4227ba537137f445ca7c3 # v7.1.1
    with:
      commit_message: 'Set version to ${{ inputs.new_version }} [skip ci]'
      commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
      tagging_message: ${{ inputs.new_version }}
      branch: ${{ inputs.new_version }}
