name: (Optionally build and) test wheel inside container

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      container-image-name:
        required: true
        type: string
      cpu-arch:
        required: true
        type: string
      python-version:
        required: true
        type: string
      build-from-source:
        required: false
        default: false
        description: 'If false, download wheel artifact from Github'
        type: boolean
      server-tag:
        required: true
        type: string

jobs:
  test-wheel:
    runs-on: ${{ inputs.cpu-arch == 'x86_64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    env:
      CONTAINER_NAME: linux-distro
      REPO_DIR_NAME: aerospike-client-python
      PYTHON_VERSION: ${{ inputs.python-version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        sparse-checkout: |
          test
          .github

    - if: ${{ contains(inputs.container-image-name, vars.JF_EXTERNAL_URL) }}
      name: Log into JFrog to pull custom manylinux image
      id: setup-jf
      uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
      env:
        JF_URL: https://${{ vars.JF_EXTERNAL_URL }}
        JF_PROJECT: ${{ vars.JFROG_PROJECT_FOR_CLIENT_TEAM }}
      with:
        oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
        oidc-audience: ${{ vars.OIDC_AUDIENCE }}

    - if: ${{ contains(inputs.container-image-name, vars.JF_EXTERNAL_URL) }}
      name: Log into internal JFrog Docker registry
      uses: docker/login-action@v4
      with:
        registry: ${{ vars.JF_EXTERNAL_URL }}/${{ vars.JFROG_REPO_FOR_CUSTOM_MANYLINUX_IMAGES }}
        username: ${{ steps.setup-jf.outputs.oidc-user }}
        password: ${{ steps.setup-jf.outputs.oidc-token }}

    - run: docker run -d  -v /:/host:ro --name "$CONTAINER_NAME" "$LINUX_DISTRO_IMAGE_NAME" tail -f /dev/null
      env:
        LINUX_DISTRO_IMAGE_NAME: ${{ inputs.container-image-name }}

    - uses: ./.github/actions/run-ee-server
      id: run-ee-server
      with:
        server-tag: ${{ inputs.server-tag }}
        oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
        oidc-audience: ${{ vars.OIDC_AUDIENCE }}
        features-content: ${{ secrets.FEATURES_CONTENT }}
        where-is-client-connecting-from: 'separate-docker-container'

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ vars.GH_ARTIFACT_NAME_PREFIX_FOR_BUILDS }}-${{ inputs.python-version }}-*manylinux*${{ inputs.cpu-arch }}*
        path: ./

    - name: Copy repo and wheel into container
      run: docker cp ../$REPO_DIR_NAME $CONTAINER_NAME:/

    - name: 'DNF based distros: install python3'
      if: ${{ inputs.container-image-name == 'amazonlinux:2023' || contains(inputs.container-image-name, 'ubi') }}
      run: docker exec "$CONTAINER_NAME" dnf install -y python3.11

    - name: 'Cat 1: build from source'
      if: ${{ inputs.build-from-source }}
      # Here we assume all cat 1 tests are running on a dnf-based distro
      run: |
        docker exec "$CONTAINER_NAME" dnf install -y libyaml-devel \
          openssl-devel \
          glibc-devel \
          autoconf \
          automake \
          libtool \
          zlib-devel \
          openssl-devel \
          python3.11-devel
        docker exec --workdir /$REPO_DIR_NAME "$CONTAINER_NAME" "python${PYTHON_VERSION}" -m pip install -r requirements.txt
        docker exec --workdir /$REPO_DIR_NAME "$CONTAINER_NAME" "python${PYTHON_VERSION}" -m build

    - name: Install wheel
      run: docker exec --workdir /$REPO_DIR_NAME "$CONTAINER_NAME" "python${PYTHON_VERSION}" -m pip install *.whl

    - name: Install test prerequisites
      run: docker exec --workdir /$REPO_DIR_NAME/test "$CONTAINER_NAME" "python${PYTHON_VERSION}" -m pip install -r requirements.txt

    - name: Run tests
      run: docker exec --workdir /$REPO_DIR_NAME/test "$CONTAINER_NAME" "python${PYTHON_VERSION}" -m pytest new_tests/

    - if: ${{ always() && steps.run-ee-server.conclusion == 'success' }}
      run: docker logs aerospike
