name: Run dev tests and promote release bundle to DEV
run-name: Run dev tests and promote release bundle to DEV (dry-run=${{ inputs.dry-run }}, test-file=${{ inputs.test-file }})

on:
  workflow_dispatch:
    inputs:
      server-tag:
        type: string
        required: true
        description: 'Server docker image tag (e.g to test a client backport version)'
      # For testing purposes
      dry-run:
        required: false
        default: false
        type: boolean
        description: Don't publish JFrog build info or create a JFrog build + release bundle
      run_tests:
        required: false
        default: false
        type: boolean
        description: Run dev tests. For speeding up debugging
      test-file:
        required: false
        type: string
        description: For speeding up debugging

jobs:
  build-artifacts:
    needs: [
      get-next-release-version-and-latest-tag
    ]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      run_tests: ${{ inputs.run_tests }}
      run-integration-tests-on-macos-x86: false
      publish-build-info: ${{ inputs.dry-run == false }}
      server-tag: ${{ inputs.server-tag }}
      test-file: ${{ inputs.test-file }}
    permissions:
      contents: read
      # For shared reusable workflows
      id-token: write
      statuses: write

  valgrind:
    needs: build-artifacts
    uses: ./.github/workflows/valgrind.yml
    with:
      server-tag: ${{ inputs.server-tag }}
      test-file: ${{ inputs.test-file }}
    secrets: inherit
    permissions:
      contents: read

  reupload-artifacts-as-one-artifact-in-github:
    needs: [
      valgrind
    ]
    runs-on: ubuntu-24.04
    steps:
    - uses: aerospike/shared-workflows/.github/actions/collect-build-artifacts@1004088a1b5122b9b71a39b40f619f6b50e78d16
    permissions:
      actions: read

  get-next-release-version-and-latest-tag:
    outputs:
      next-release-version: ${{ steps.get-next-release-version.outputs.next_release_version }}
      latest-tag: ${{ steps.get-latest-tag.outputs.latest_tag }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
      with:
        egress-policy: audit

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0

    - name: Install library that parses PEP 440 versions
      run: pip install parver -c requirements.txt
      working-directory: .github/workflows

    - id: get-next-release-version
      run: echo next_release_version=$(cat VERSION) >> $GITHUB_OUTPUT

    - id: get-latest-tag
      run: |
        latest_tag=$(git describe --tags --exact-match $prev_commit)
        if [[ "$latest_tag" == "$next_release_version" ]]; then
          echo "We have not merged any changes to dev since the last release yet." >&2
          exit 1
        fi
        echo latest_tag=$latest_tag >> $GITHUB_OUTPUT

  upload-artifacts-to-jfrog:
    needs: [
      get-next-release-version-and-latest-tag,
      reupload-artifacts-as-one-artifact-in-github
    ]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@1004088a1b5122b9b71a39b40f619f6b50e78d16
    with:
      jf-project: ${{ vars.JFROG_PROJECT_FOR_CLIENT_TEAM }}
      jf-build-name: ${{ vars.JFROG_BUILD_NAME }}
      # TODO: may be easier to have a default for these two inputs
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo
      version: ${{ needs.get-next-release-version-and-latest-tag.outputs.next-release-version }}
      gh-workflows-ref: 1004088a1b5122b9b71a39b40f619f6b50e78d16
      dry-run: ${{ inputs.dry-run }}
    permissions:
      id-token: write
      actions: read

  create-release-bundle-and-promote-to-dev:
    if: ${{ inputs.dry-run }}
    needs: [
      upload-artifacts-to-jfrog,
      get-next-release-version-and-latest-tag
    ]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@1004088a1b5122b9b71a39b40f619f6b50e78d16
    with:
      jf-project: ${{ vars.JFROG_PROJECT_FOR_CLIENT_TEAM }}
      jf-build-names: ${{ vars.JFROG_BUILD_NAME }}
      jf-bundle-name: ${{ vars.JFROG_BUILD_NAME }}
      # JFrog release bundle version
      version: ${{ needs.get-next-release-version-and-latest-tag.outputs.latest-tag }}
      gh-workflows-ref: 1004088a1b5122b9b71a39b40f619f6b50e78d16 # Should match the version in your 'uses:' line
    permissions:
      id-token: write
