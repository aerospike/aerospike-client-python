permissions:
  id-token: write

on:
  workflow_call:
    inputs:
      release-bundle-name:
        type: string
        required: true
      release-bundle-version:
        type: string
        required: true
      new-environment:
        type: string
        required: true
      jfrog-project:
        type: string
        required: true
      jfrog-repo-name:
        type: string
        required: true

jobs:
  promote-release-bundle-to-dev:
    runs-on: ubuntu-24.04
    steps:
    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
      env:
        JF_URL: https://${{ vars.JF_EXTERNAL_URL }}
        JF_PROJECT: ${{ inputs.jfrog-project }}
      with:
        version: '2.92.0'
        oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
        oidc-audience: ${{ vars.OIDC_AUDIENCE }}

    - uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@8a4e717507bc3394c4defac0abe4ffd73b4f4e14
      with:
        bundle-name: ${{ inputs.release-bundle-name }}
        version: ${{ inputs.release-bundle-version }}
        environment: ${{ inputs.new-environment }}
        jf-project: ${{ inputs.jfrog-project }}
