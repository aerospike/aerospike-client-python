name: Build artifacts
run-name: Build artifacts (run_tests=${{ inputs.run_tests }}, registry-name=${{ inputs.registry-name }}, server-tag=${{ inputs.server-tag }})

# Builds manylinux wheels and source distribution
# Optionally run tests on manylinux wheels
# Then upload artifacts to Github

permissions:
  id-token: write
  statuses: write
  contents: read

on:
  workflow_dispatch:
    inputs: &inputs
      # There may be a case where we want to test these build debug flags on all platforms that support them
      unoptimized:
        description: 'macOS or Linux: Apply -O0 flag?'
        type: boolean
        required: false
        default: false
      include-debug-info-for-macos:
        description: 'macOS: Build wheels for debugging?'
        type: boolean
        required: false
        default: false
      run_tests:
        description: "Run integration tests with the wheels after building them"
        required: true
        type: boolean
        default: false
      server-tag:
        type: string
        required: false
        description: 'Server docker image tag (e.g to test a client backport version)'
      test-file:
        required: false
        type: string
        default: ''
        description: 'new_tests/<value>'
      run-integration-tests-on-macos-x86:
        required: false
        default: true
        type: boolean
        description: 'If false, only run import test'
      publish-build-info:
        required: false
        default: false
        type: boolean

  workflow_call:
    secrets:
      MAC_M1_SELF_HOSTED_RUNNER_PW:
        required: false
    # A calling workflow doesn't actually set values to the inputs below
    # But that workflow needs to have default values for these inputs
    inputs: *inputs

jobs:
  build-sdist:
    uses: ./.github/workflows/build-sdist.yml

  build-wheels:
    strategy:
      matrix:
        platform-tag: [
          "manylinux_x86_64",
          "manylinux_aarch64",
          "macosx_x86_64",
          "macosx_arm64",
          "win_amd64"
        ]
      fail-fast: false
    uses: ./.github/workflows/build-and-optionally-test-wheels-on-one-platform.yml
    with:
      platform-tag: ${{ matrix.platform-tag }}
      unoptimized: ${{ inputs.unoptimized }}
      include-debug-info-for-macos: ${{ inputs.include-debug-info-for-macos }}
      run_tests: ${{ inputs.run_tests }}
      server-tag: ${{ inputs.server-tag }}
      test-file: ${{ inputs.test-file }}
      run-integration-tests-on-macos-x86: ${{ inputs.run-integration-tests-on-macos-x86 }}
      publish-build-info: ${{ inputs.publish-build-info }}
    secrets: inherit
