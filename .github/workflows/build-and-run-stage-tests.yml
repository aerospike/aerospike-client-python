name: Build artifacts and run stage tests
run-name: Build artifacts and run stage tests (registry-name=${{ inputs.registry-name }}, server-tag=${{ inputs.server-tag }})

permissions:
  contents: read
  id-token: write
  statuses: write

on:
  workflow_dispatch:
    inputs:
      server-tag:
        type: string
        required: true
        description: 'Server docker image tag'

jobs:
  build-select-wheels:
    strategy:
      matrix:
        platform-tag: [
          "manylinux_x86_64",
          "manylinux_aarch64",
          # For macos 15
          "macosx_x86_64",
          # For macos 26
          "macosx_arm64"
        ]
      # Need all the artifacts to run all the stage tests, so fail fast
    uses: ./.github/workflows/build-and-optionally-test-wheels-on-one-platform.yml
    with:
      platform-tag: ${{ matrix.platform-tag }}
    secrets: inherit

  build-sdist:
    uses: ./.github/workflows/build-sdist.yml
    with:
      sha_to_build: ${{ github.sha }}

  run-stage-tests:
    uses: ./.github/workflows/stage-tests.yml
    needs: [
      build-select-wheels,
      build-sdist
    ]
    secrets: inherit
    with:
      use_jfrog_builds: false
      server-tag: ${{ inputs.server-tag }}
      test-macos-x86: true
