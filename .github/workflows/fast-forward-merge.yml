# As of this writing, there are no Github Actions in the marketplace
# that allow fast forwarding using a personal access token
# So we need to use this for now
name: 'Fast forward merge'
on:
  workflow_dispatch:
    inputs:
      ref_to_merge:
        type: string
        required: true
      base_branch:
        type: string
        required: true
  workflow_call:
    inputs:
      # If another branch, it must be origin/<branch>
      ref_to_merge:
        type: string
        required: true
      base_branch:
        type: string
        required: true

jobs:
  merge:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the whole history to prevent unrelated history errors
          fetch-depth: '0'
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.CLIENT_BOT_PAT }}

      - name: Fast forward
        run: git merge --ff-only "$REF_TO_MERGE"
        env:
          REF_TO_MERGE: ${{ inputs.ref_to_merge }}

      - name: Upload changes to remote head branch
        run: git push
