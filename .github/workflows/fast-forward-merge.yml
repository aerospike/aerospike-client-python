# As of this writing, there are no Github Actions in the marketplace
# that allow fast forwarding using a personal access token
# So we need to use this for now
name: 'Fast forward merge'
on:
  workflow_dispatch:
    inputs:
      ref_to_merge:
        type: string
        required: true
      base_branch:
        type: string
        required: true
  workflow_call:
    inputs:
      # If another branch, it must be origin/<branch>
      ref_to_merge:
        type: string
        required: true
      base_branch:
        type: string
        required: true

jobs:
  merge:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch the whole history to prevent unrelated history errors
          fetch-depth: '0'
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.CLIENT_BOT_PAT }}

      - name: Fast forward
        run: git merge --ff-only "$REF_TO_MERGE"
        env:
          REF_TO_MERGE: ${{ inputs.ref_to_merge }}

      - name: Upload changes to remote head branch
        run: git push
