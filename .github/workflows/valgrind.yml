on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.10'
        required: false
      massif:
        type: boolean
        required: false
        default: false
      registry-name:
        type: string
        required: true
      image-name:
        type: string
        required: true
      server-tag:
        type: string
        required: true
    secrets:
      QE_DOCKER_REGISTRY_USERNAME:
        required: false
      QE_DOCKER_REGISTRY_PASSWORD:
        required: false

jobs:
  valgrind:
    env:
      MASSIF_REPORT_FILE_NAME: massif.out
    runs-on: ubuntu-22.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifacts-${{ inputs.python-version }}-*linux*x86_64*

    - name: Install client
      run: pip install ./*.whl

    - name: Install test dependencies
      run: pip install -r test/requirements.txt

    - name: Run EE server
      uses: ./.github/actions/run-ee-server
      with:
        registry-name: ${{ inputs.registry-name }}
        registry-username: ${{ inputs.registry-name == vars.QE_SECURE_DOCKER_REGISTRY_URL && secrets.QE_DOCKER_REGISTRY_USERNAME || '' }}
        registry-password: ${{ inputs.registry-name == vars.QE_SECURE_DOCKER_REGISTRY_URL && secrets.QE_DOCKER_REGISTRY_PASSWORD || '' }}
        image-name: ${{ inputs.image-name }}
        server-tag: ${{ inputs.server-tag }}

    - run: sudo apt-get update
    - run: sudo apt-get install valgrind -y

    - run: echo VALGRIND_ARGS="--tool=massif --massif-out-file=./${{ env.MASSIF_REPORT_FILE_NAME }}" >> $GITHUB_ENV
      if: ${{ inputs.massif }}

    - run: echo VALGRIND_ARGS="--leak-check=full --errors-for-leak-kinds=none" >> $GITHUB_ENV
      if: ${{ !inputs.massif }}

    - run: PYTHONMALLOC=malloc valgrind --error-exitcode=1 $VALGRIND_ARGS python3 -m pytest -v new_tests/${{ github.event.inputs.test-file }}
      working-directory: test

    # TODO: upload report as artifact
    - run: ms_print ./${{ env.MASSIF_REPORT_FILE_NAME }}
      if: ${{ !cancelled() && inputs.massif }}
      working-directory: test
