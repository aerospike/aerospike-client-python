name: Run dev tests and promote release bundle to DEV
run-name: Run dev tests and promote release bundle to DEV (dry-run=${{ inputs.dry-run }}, test-file=${{ inputs.test-file }})

permissions:
  # We are building the artifacts in build-artifacts.yml
  contents: read
  # For shared reusable workflows
  # TODO: look into more
  id-token: write
  statuses: write
  # For downloading docker images from ghcr.io
  packages: read

on:
  workflow_dispatch:
    inputs:
      # These inputs are in case we need to test against a server RC
      registry-name:
        type: string
        required: true
        description: Registry name
        default: 'docker.io'
      image-name:
        type: string
        required: true
        description: Image name
        default: 'aerospike/aerospike-server-enterprise'
      server-tag:
        type: string
        required: true
        default: 'latest'
        description: 'Server docker image tag (e.g to test a client backport version)'
      # For testing purposes
      dry-run:
        required: false
        default: false
        type: boolean
        description: Don't create release bundle
      run_tests:
        required: false
        default: false
        type: boolean
        description: Run dev tests
      test-file:
        required: false
        type: string
        description: For speeding up debugging

jobs:
  build-test-and-publish-artifacts-as-release-bundle:
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@8a4e717507bc3394c4defac0abe4ffd73b4f4e14
    with:
      gh-workflows-ref: 8a4e717507bc3394c4defac0abe4ffd73b4f4e14
      gh-artifact-directory: dist
      jf-project: ${{ vars.JFROG_PROJECT_FOR_CLIENT_TEAM }}
      jf-build-name: ${{ vars.JFROG_BUILD_NAME }}
      oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
      oidc-audience: ${{ vars.OIDC_AUDIENCE }}
      # TODO: need to get from repo somehow.
      # version: ${{ needs.run-dev-tests.outputs.build-version }}
      # TODO
      # build-script-path:
    secrets: inherit
