on:
  workflow_call:
    inputs:
      platform-tag:
        type: string
        required: true
    outputs:
      platform-tags:
        value: ${{ jobs.get-runner-os-and-python-versions.outputs.platform-tags }}
      runner-oses:
        value: ${{ jobs.get-runner-os-and-python-versions.outputs.runner-oses }}
      python-versions:
        value: ${{ jobs.get-runner-os-and-python-versions.outputs.python-versions }}

permissions:
  contents: read

jobs:
  get-runner-os-and-python-versions:
    outputs:
      runner-oses: ${{ steps.get-runner-oses.outputs.runner_oses }}
      python-versions: ${{ steps.get-python-versions.outputs.python_versions }}
      runner-os-to-platform-tag: ${{ steps.get-runner-os-to-platform-tag.outputs.runner-os-to-platform-tag }}
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - id: get-runner-oses
      run: |
        if [[ "${{ inputs.platform-tag }}" == "*" ]]; then
          echo runner_oses=$(cat .github/workflows/prod-wheel-matrix.json | jq '[.["platform-tag-to-runner-os"].[]]') >> $GITHUB_OUTPUT
        else
          echo runner_oses=$(cat .github/workflows/prod-wheel-matrix.json | jq --arg platform_tag "$platform_tag" '.["platform-tag-to-runner-os"].[$platform_tag]') >> $GITHUB_OUTPUT
        fi

    - id: get-python-versions
      run: echo python_versions=$(cat .github/workflows/prod-wheel-matrix.json | jq '.["python-versions"]') >> $GITHUB_OUTPUT

    - id: get-runner-os-to-platform-tag
      run: |
        echo runner-os-to-platform-tag=$(cat .github/workflows/prod-wheel-matrix.json | jq '.["platform-tag-to-runner-os"] | with_entries({key: .value, value: .key})') >> $GITHUB_OUTPUT
