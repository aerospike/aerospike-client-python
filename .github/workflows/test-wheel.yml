on:
  workflow_call:
    inputs:
      runner-os-json-string:
        required: true
        type: string
        description: 'Runner OS to use. Can be a JSON list or raw string'
      # For downloading the correct wheel from upstream jobs
      python-version:
        required: true
        type: string
        description: 'Python wheel version to test'
      server-tag:
        required: true
        type: string
        description: 'Only used if running integration tests'
      run-integration-tests:
        type: boolean
        required: false
        default: true
        description: 'If false, only run import test'
      test-ce:
        type: boolean
        required: false
        default: false
        description: 'Only used if running integration tests. If false, run EE server'
      test-file:
        required: false
        type: string
        description: 'Only used if running integration tests'
      env-vars:
        required: false
        type: string
        default: ''

jobs:
  test-wheel:
    runs-on: ${{ fromJson(inputs.runner-os-json-string) }}
    env:
      CE_CONTAINER_NAME: aerospike
      PYTHON_VERSION: ${{ inputs.python-version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - name: Get platform tag of wheel to download
      run: |
        os=$(uname -s)
        arch=$(uname -m)
        if [[ $os =~ Darwin* ]]; then
          PLATFORM_TAG_GLOB_PATTERN="macosx_$arch"
        elif [[ $os =~ CYGWIN* || $os =~ MINGW* ]]; then
          PLATFORM_TAG_GLOB_PATTERN=win_amd64
        elif [[ $os =~ Linux* ]]; then
          PLATFORM_TAG_GLOB_PATTERN="linux_$arch"
        fi

        if [[ "$DOWNLOAD_SANITIZER_WHEEL" == "true" ]]; then
          PLATFORM_TAG_GLOB_PATTERN="${PLATFORM_TAG_GLOB_PATTERN}-sanitizer"
        fi
        echo "PLATFORM_TAG_GLOB_PATTERN=$PLATFORM_TAG_GLOB_PATTERN" >> $GITHUB_ENV
      shell: bash
      env:
        DOWNLOAD_SANITIZER_WHEEL: ${{ contains(inputs.env-vars, 'SANITIZER') }}

    - name: Create status check message
      run: |
        echo STATUS_CHECK_MESSAGE="Test wheel ($PYTHON_VERSION-$PLATFORM_TAG_GLOB_PATTERN)" >> $GITHUB_ENV
      shell: bash

    - name: Show job status for commit
      uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
      if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
      with:
        sha: ${{ github.sha }}
        context: ${{ env.STATUS_CHECK_MESSAGE }}

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - run: echo GH_ARTIFACT_PATTERN_FOR_WHEEL=$GH_ARTIFACT_NAME_PREFIX_FOR_BUILDS-$PYTHON_VERSION-$PLATFORM_TAG_GLOB_PATTERN >> $GITHUB_ENV
      shell: bash
      env:
        GH_ARTIFACT_NAME_PREFIX_FOR_BUILDS: ${{ vars.GH_ARTIFACT_NAME_PREFIX_FOR_BUILDS }}

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ env.GH_ARTIFACT_PATTERN_FOR_WHEEL }}
        path: ./

    - name: Sanity test that only one wheel was pulled
      run: |
        wheel_count=$(find . -maxdepth 1 -type f -name '*.whl' | wc -l | xargs)
        test "$wheel_count" = "1"
      # For seeing how many wheels were pulled from github
      shell: bash -x {0}

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install wheel
      run: pip install *.whl
      shell: bash

    - if: ${{ inputs.run-integration-tests }}
      run: pip install -r requirements.txt
      working-directory: test
      shell: bash

    # Need to be able to save Docker Hub credentials to keychain
    # Unable to do this via the ansible script for self hosted mac m1 runners
    - if: ${{ inputs.run-integration-tests && contains(env.PLATFORM_TAG_GLOB_PATTERN, 'macosx_arm64') }}
      run: security unlock-keychain -p "$MAC_M1_SELF_HOSTED_RUNNER_PW"
      shell: bash
      env:
        MAC_M1_SELF_HOSTED_RUNNER_PW: ${{ secrets.MAC_M1_SELF_HOSTED_RUNNER_PW }}

    - name: 'macOS x86: Setup Docker using colima for testing'
      if: ${{ inputs.run-integration-tests && contains(env.PLATFORM_TAG_GLOB_PATTERN, 'macosx_x86_64') }}
      uses: ./.github/actions/setup-docker-on-macos

    - if: ${{ inputs.run-integration-tests && inputs.test-ce }}
      name: Run CE server
      run: |
        docker run -d --name "$CE_CONTAINER_NAME" -p 3000:3000 -e DEFAULT_TTL=2592000 "aerospike/aerospike-server:$SERVER_TAG"
        cp config.conf.template config.conf
      working-directory: test
      shell: bash
      env:
        SERVER_TAG: ${{ inputs.server-tag }}

    - if: ${{ inputs.run-integration-tests && inputs.test-ce }}
      uses: ./.github/actions/wait-for-ce-server-to-start
      with:
        container-name: ${{ env.CE_CONTAINER_NAME }}

    - if: ${{ inputs.run-integration-tests && inputs.test-ce == false }}
      id: run-ee-server
      uses: ./.github/actions/run-ee-server
      with:
        oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
        oidc-audience: ${{ vars.OIDC_AUDIENCE }}
        features-content: ${{ secrets.FEATURES_CONTENT }}
        server-tag: ${{ inputs.server-tag }}
        where-is-client-connecting-from: ${{ contains(env.PLATFORM_TAG_GLOB_PATTERN, 'win_amd64') && 'remote-connection' || 'docker-host' }}
      env:
        MSYS_NO_PATHCONV: 1

    - if: ${{ contains(inputs.env-vars, 'DONT_VALIDATE_KEYS') }}
      run: crudini --existing=param --set config.conf input-validation validate_keys false
      working-directory: test
      shell: bash

    # We can already detect leaks using valgrind
    # halt_on_error must be enabled, or else this job won't fail if a memory error occurs
    - if: ${{ contains(inputs.env-vars, 'SANITIZER') }}
      run: |
        echo ASAN_OPTIONS='detect_stack_use_after_return=1:detect_leaks=0' >> $GITHUB_ENV
        echo LD_PRELOAD=$(gcc --print-file-name=libasan.so) >> $GITHUB_ENV
      shell: bash

    # -s: we want to check that the test_create_pki_user test case passes or raises an exception as expected
    # There's no way to tell unless we see the logs
    # eval needed to perform variable expansion before brace expansion inside $TEST_FILE
    - if: ${{ inputs.run-integration-tests }}
      run: |
        eval python3 -m pytest -vvs --full-trace new_tests/$TEST_FILE -W error::pytest.PytestUnraisableExceptionWarning -W error::DeprecationWarning
      working-directory: test
      shell: bash
      env:
        TEST_FILE: ${{ inputs.test-file }}

    - if: ${{ inputs.run-integration-tests == false }}
      run: python3 -c "import aerospike"
      shell: bash

    - name: Show server logs to debug test results
      if: ${{ always() && inputs.run-integration-tests && steps.run-ee-server.conclusion == 'success' }}
      run: docker logs "$CONTAINER_NAME"
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.test-ce == true && env.CE_CONTAINER_NAME || steps.run-ee-server.outputs.container-name }}

    - name: Show job status for commit
      if: ${{ always() && github.event_name != 'push' && github.event_name != 'pull_request' }}
      uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
      with:
        sha: ${{ github.sha }}
        status: ${{ job.status }}
        context: ${{ env.STATUS_CHECK_MESSAGE }}
