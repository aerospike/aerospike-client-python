name: Documentation tests
permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
    - src/**/*
    - aerospike-client-c
    - aerospike-stubs/**/*
    - test/**/*
    - 'README.rst'
    - '**/*.md'
    - stubtest-allowlist
    # Only used by QE
    - scripts/**/*
    - .build.yml
  push:
    # To any central branch
    branches:
      - "dev*"
      - "stage*"
      - "master*"
      - "v*-backport*"
  # For debugging this workflow
  workflow_dispatch:

jobs:
  sphinx:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        builder-command:
        - 'spelling . spelling -W --keep-going'
        # -vv is too verbose and makes it hard to read logs
        - 'linkcheck -vv . links'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        submodules: recursive
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12
        architecture: 'x64'
    - name: Install dependencies
      # TODO: find way to split up dependencies
      run: python -m pip install -r doc/requirements.txt
    - name: Run builder
      id: builder
      run: sphinx-build -b ${{ matrix.builder-command }}
      working-directory: doc
    - if: ${{ !cancelled() && steps.builder.outcome == 'failure' }}
      run: sphinx-build --bug-report
      working-directory: doc
