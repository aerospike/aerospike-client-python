name: Publish JFrog build to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Build version
        required: true
      use-test-pypi:
        type: boolean
        description: 'DEBUG: upload to test.pypi.org?'
        required: true
        default: false

jobs:
  publish-jfrog-build-to-pypi:
    runs-on: ubuntu-22.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
      env:
        JF_URL: https://${{ vars.JF_EXTERNAL_URL }}
        JF_PROJECT: ${{ vars.JFROG_PROJECT_FOR_CLIENT_TEAM }}
      with:
        oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
        oidc-audience: ${{ vars.OIDC_AUDIENCE }}

    - name: Download JFrog build
      run: jf rt dl --build "$JFROG_BUILD_NAME/$VERSION_TO_PUBLISH" "$JF_REPO_NAME"
      env:
        JF_BUILD_NAME: ${{ vars.JFROG_BUILD_NAME }}
        VERSION_TO_PUBLISH: ${{ inputs.version }}
        JF_REPO_NAME: ${{ vars.JFROG_REPO_NAME }}

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        # This is the directory jf downloads the artifacts to
        packages-dir: aerospike/${{ inputs.version }}/artifacts
        repository-url: ${{ inputs.use-test-pypi && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        password: ${{ inputs.use-test-pypi && secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
