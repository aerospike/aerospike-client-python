service {
    cluster-name docker
    proto-fd-max 15000
}

logging {
    console {
        context any detail
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        address local
        interval 150
        mode mesh
        port 3002
        timeout 10
    }
    fabric {
        address local
        port 3001
    }
}

namespace test {
    replication-factor 1
    default-ttl 30d
    allow-ttl-without-nsup true
    storage-engine device {
        file /opt/aerospike/data/test.dat
        filesize 4G
    }
}
